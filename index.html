<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="时间管理局" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>时间管理局 · 狗狗日程报</title>
<style>
  :root {
    --page-bg: #e8f1fc; --surface-card: #ffffff; --surface-nested: #f0f6fe;
    --border: #d6e4f7; --border-input: #b8d0ee;
    --text: #0a1834; --text-secondary: #475569; --text-tertiary: #7c8ba5;
    --accent: #2563eb; --accent-muted: #dbeafe; --on-accent: #ffffff;
    --module-1: #0d9488; --module-2: #6366f1; --module-3: #f59e0b; --module-4: #ec4899; --module-5: #8b5cf6;
    --danger: #ef4444; --danger-muted: #fef2f2;
    --drawer-bg: #0a1834; --drawer-bg-top: #142b5c; --drawer-text: #e8f1fc;
    --drawer-text-mute: rgba(232,241,252,.55); --drawer-hover: rgba(232,241,252,.1); --drawer-active: rgba(232,241,252,.09);
    --greet-image: url("assets/greet-banner.jpg"); --page-texture: none;
    --radius-control: 8px; --radius-tile: 12px; --radius-card: 16px; --radius-sheet: 22px;
    --shadow-card: 0 1px 2px rgba(10,24,52,.04), 0 4px 16px rgba(37,99,235,.06);
    --shadow-overlay: 0 10px 28px rgba(10,24,52,.15);
    --font: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --nav-h: 62px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--module-2); outline-offset: 2px; border-radius: 4px; }
  html, body { height: 100%; } html { background: var(--page-bg); }
  body {
    background-color: var(--page-bg);
    background-image: linear-gradient(rgba(37,99,235,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(37,99,235,.045) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    max-width: 480px; margin: 0 auto; position: relative; min-height: 100dvh; overflow-x: hidden;
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background-image: var(--page-texture); background-size: cover; opacity:.5; }
  .app { padding: 0 16px calc(var(--nav-h) + 26px); } svg { display: block; }

  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 14px 2px 12px; backdrop-filter: blur(10px); background: linear-gradient(180deg, color-mix(in srgb, var(--page-bg) 94%, transparent), color-mix(in srgb, var(--page-bg) 50%, transparent)); }
  .topbar .menu-btn { width: 38px; height: 38px; border: none; border-radius: var(--radius-tile); background: var(--surface-card); box-shadow: var(--shadow-card); display: grid; place-items: center; cursor: pointer; color: var(--text); }
  .topbar .title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; flex: 1; line-height: 1.2; }
  .topbar .title small { display:block; font-size: 11px; font-weight: 500; color: var(--text-secondary); letter-spacing:.02em; margin-top: 2px; }
  .date-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); background: var(--surface-card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }
  .icon-btn { width:38px; height:38px; border:1px solid var(--border); border-radius:12px; background:linear-gradient(135deg, var(--surface-card), color-mix(in srgb, var(--surface-card) 88%, var(--accent) 12%)); box-shadow:0 2px 8px rgba(37,99,235,.10); display:grid; place-items:center; cursor:pointer; color:var(--accent); flex:0 0 auto; position:relative; transition: all .2s ease; }
  .icon-btn:active { transform:scale(.92); box-shadow:0 1px 4px rgba(37,99,235,.15); }
  .icon-btn.connected { background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 8%, var(--surface-card)), color-mix(in srgb, var(--accent) 16%, var(--surface-card))); border-color:color-mix(in srgb, var(--accent) 30%, var(--border)); }
  .sync-badge { position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:999px; background:var(--module-1); border:2px solid var(--surface-card); box-shadow:0 0 0 1px var(--border); }
  .sync-badge.off { background:var(--text-tertiary); animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(.8); } }

  .sync-status { display:flex; align-items:center; gap:8px; padding:12px 14px; border-radius:var(--radius-card); background:var(--surface-nested); margin-bottom:14px; }
  .sync-status .ss-icon { width:36px; height:36px; border-radius:var(--radius-tile); display:grid; place-items:center; flex:0 0 auto; }
  .sync-status .ss-text { flex:1; min-width:0; }
  .sync-status .ss-title { font-size:14px; font-weight:700; }
  .sync-status .ss-sub { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .sync-link { display:block; text-align:center; font-size:12px; color:var(--accent); padding:10px; border:1px dashed var(--border-input); border-radius:var(--radius-tile); margin-bottom:12px; text-decoration:none; }

  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size: 14px; font-weight: 700; margin: 24px 2px 12px; letter-spacing: -.01em; }
  .sec-title::before { content:""; width: 3px; height: 13px; border-radius: 2px; background: linear-gradient(180deg, var(--accent), var(--module-2)); }

  .greet { position: relative; overflow: hidden; margin-top: 10px; padding: 22px 20px 24px; border-radius: var(--radius-card); border: 1px solid var(--border); box-shadow: var(--shadow-card), 0 0 24px rgba(37,99,235,.08); min-height: 132px; background: var(--surface-nested) var(--greet-image) right center / cover no-repeat; }
  .greet::before { content:""; position:absolute; inset:0; pointer-events:none; background: linear-gradient(100deg, var(--surface-nested) 30%, color-mix(in srgb, var(--surface-nested) 70%, transparent) 48%, transparent 70%); }
  .greet > * { position: relative; z-index: 1; }
  .bureau-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.03em; padding: 4px 11px; border-radius: 999px; background: rgba(37,99,235,.12); color: var(--accent); margin-bottom: 10px; backdrop-filter: blur(4px); }
  .greet h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; } .greet p { color: var(--text-secondary); font-size: 13px; margin-top: 5px; }
  .greet .add { position: absolute; top: 16px; right: 16px; z-index: 2; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px; background: var(--accent); color:var(--on-accent); font-size: 13px; font-weight: 700; padding: 9px 15px 9px 12px; border-radius: 999px; box-shadow: var(--shadow-overlay); transition: transform .12s, filter .15s; }
  .greet .add:active { transform: scale(.95); filter: brightness(1.15); } .greet .add svg { margin-top: -1px; }

  .quote { margin-top: 16px; padding: 16px 18px; border-radius: var(--radius-card); background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); position: relative; }
  .quote::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:2px; background: linear-gradient(180deg, var(--accent), var(--module-5)); }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: .04em; margin-bottom: 9px; } .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size: 16px; font-weight: 600; line-height: 1.55; color: var(--text); }

  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 20px 6px; margin-top: 14px; }
  .ring { display:flex; flex-direction:column; align-items:center; gap: 8px; cursor:pointer; }
  .ring .dial { position: relative; width: 68px; height: 68px; } .ring .dial svg.gauge { transform: rotate(-90deg); width: 68px; height: 68px; }
  .ring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; }
  .ring .pct { font-size: 15px; font-weight: 700; letter-spacing: -.02em; } .ring .lbl { font-size: 12px; color: var(--text); font-weight: 600; } .ring .sub { font-size: 11px; color: var(--text-secondary); }

  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 14px; }
  .panel.trend-panel { margin-top: 12px; } .panel .ph { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; } .panel .ph svg { color: var(--text-tertiary); } .panel .ph .avg { margin-left:auto; font-size:11px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height: auto; margin-top: 12px; display:block; } .trend-x { display:flex; justify-content:space-between; font-size:10px; color:var(--text-secondary); margin-top:4px; padding: 0 6px; }
  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height: 120px; color: var(--text-tertiary); font-size: 12px; margin-top: 8px; }
  .quick-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .qbtn { display:flex; flex-direction:column; align-items:center; gap:9px; padding: 15px 6px 12px; border:none; cursor:pointer; border-radius: var(--radius-tile); background: var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card); text-align:center; transition: transform .12s, border-color .15s, box-shadow .15s; }
  .qbtn:active { transform: scale(.95); border-color: var(--border-input); box-shadow: var(--shadow-overlay), 0 0 12px rgba(37,99,235,.15); }
  .qbtn .e { position: relative; width: 44px; height: 44px; border-radius: var(--radius-tile); display:grid; place-items:center; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%; background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size: 12px; font-weight: 600; color: var(--text); }

  .pin-list { display:flex; flex-direction:column; gap: 8px; }
  .pin { display:flex; align-items:center; gap: 11px; padding: 12px 14px; border-radius: var(--radius-tile); background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .pin-ic { width: 32px; height: 32px; border-radius: var(--radius-tile); display:grid; place-items:center; flex:0 0 auto; background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; } .pin-t { font-size: 14px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 11px; color: var(--text-secondary); margin-top: 2px; } .pin .arw { color: var(--text-tertiary); flex:0 0 auto; }
  .pin-chk { flex:0 0 auto; width: 24px; height: 24px; border-radius: var(--radius-control); border: 1.6px solid var(--border-input); display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:#fff; transition: all .15s; }
  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); } .pin-chk svg { opacity: 0; } .pin-chk.on svg { opacity: 1; }
  .pin-step { flex:0 0 auto; display:flex; gap: 6px; }
  .pin-step button { width: 28px; height: 28px; border-radius: var(--radius-control); border: 1px solid var(--border-input); background: var(--surface-nested); color: var(--text); font-size: 17px; line-height: 1; cursor:pointer; display:grid; place-items:center; transition: all .15s; }
  .pin-step button:active { background: var(--accent-muted); border-color: var(--accent); }
  .pin-empty { padding: 20px 16px; text-align:center; color: var(--text-secondary); font-size: 12px; line-height: 1.7; background: var(--surface-card); border: 1px dashed var(--border-input); border-radius: var(--radius-tile); }
  .pin-empty .mini-star { display:inline-flex; vertical-align:-2px; color: var(--module-3); }

  .rec { position: relative; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile); box-shadow: var(--shadow-card); padding: 13px 14px; margin-bottom: 9px; transition: border-color .15s, opacity .25s, transform .25s; }
  .rec:active { border-color: var(--border-input); } .rec .top { display:flex; align-items:flex-start; gap: 11px; }
  .rec .chk { flex:0 0 auto; width: 22px; height: 22px; border-radius: var(--radius-control); border: 1.6px solid var(--border-input); display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:#fff; transition: all .15s; margin-top: 1px; }
  .rec .chk.on { background: var(--module-1); border-color: var(--module-1); } .rec .chk svg { opacity: 0; } .rec .chk.on svg { opacity: 1; }
  .rec .body { flex:1; min-width:0; padding-right: 52px; } .rec .rname { font-weight: 600; font-size: 14.5px; letter-spacing: -.01em; } .rec .rname.done { text-decoration: line-through; color: var(--text-secondary); }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap: 7px; margin-top: 7px; align-items:center; } .rec .rnote { color: var(--text-secondary); font-size: 12.5px; margin-top: 7px; white-space: pre-wrap; line-height: 1.55; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; } .badge .dot { width:6px;height:6px;border-radius:50%;background:currentColor; }
  .rec .acts { position:absolute; top: 8px; right: 8px; display:flex; gap: 2px; }
  .rec .acts button { border:none; background:transparent; color: var(--text-tertiary); cursor:pointer; width: 30px; height: 30px; border-radius: var(--radius-control); display:grid; place-items:center; transition: all .15s; }
  .rec .pin-btn:hover { background: var(--surface-nested); color: var(--module-3); } .rec .pin-btn.on { color: var(--module-3); } .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec .del:hover { background: var(--danger-muted); color: var(--danger); }
  .rec .pbar { height: 5px; border-radius:999px; background: var(--border); overflow:hidden; margin-top: 10px; } .rec .pbar i { display:block; height:100%; border-radius:999px; }
  .rec .streak { font-size:12px; color: var(--module-3); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .rec .meta-line { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px; } .rec .meta-tag { font-size:12px; font-weight:600; color:var(--text-secondary); } .rec .meta-tag::before { content:"·"; margin-right:6px; color:var(--text-tertiary); } .rec .meta-tag:first-child::before { display:none; }
  .rec.rec-layout-feature { flex-direction:column; padding:0; overflow:hidden; } .rec.rec-layout-feature .thumb { width:100%; height:140px; border-radius:0; margin:0; } .rec.rec-layout-feature .feat-title { padding:10px 12px 4px; font-size:15px; font-weight:700; color:var(--text); } .rec.rec-layout-feature .feat-body { padding:0 12px 12px; font-size:13px; color:var(--text-secondary); }
  .rec.rec-layout-quote { flex-direction:column; align-items:center; text-align:center; padding:20px 16px; } .rec.rec-layout-quote .quote-text { font-size:16px; font-weight:600; line-height:1.6; color:var(--text); } .rec.rec-layout-quote .quote-meta { margin-top:8px; font-size:12px; color:var(--text-tertiary); }
  .rec .thumb { width:48px; height:48px; border-radius:var(--radius-tile); object-fit:cover; flex:0 0 auto; margin-right:2px; }

  .empty { text-align:center; color: var(--text-secondary); padding: 48px 20px; } .empty .e { display:inline-grid; place-items:center; width: 58px; height:58px; border-radius: var(--radius-card); background: var(--surface-card); border:1px solid var(--border); color: var(--text-tertiary); margin-bottom: 14px; }
  .mod-summary { display:grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
  .mini { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile); box-shadow: var(--shadow-card); padding: 12px; } .mini .l { font-size: 11px; color: var(--text-secondary); } .mini .v { font-size: 18px; font-weight: 800; margin-top: 3px; letter-spacing: -.02em; }
  .hero { display:flex; align-items:center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-tile); background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); position:relative; overflow:hidden; }
  .hero-ic { width: 36px; height: 36px; border-radius: var(--radius-tile); display:grid; place-items:center; flex:0 0 auto; }
  .hero-tx { min-width:0; display:flex; align-items:baseline; gap: 7px; flex-wrap:wrap; } .hero-v { font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1; } .hero-l { font-size: 12px; color: var(--text-secondary); }
  .hero-bar { height: 5px; border-radius: 999px; background: var(--border); overflow:hidden; margin-top: 10px; } .hero-bar i { display:block; height:100%; border-radius:999px; }

  /* module tabs */
  .mod-tabs { display:flex; gap:0; margin-bottom:14px; background:var(--surface-nested); border-radius:var(--radius-tile); padding:3px; border:1px solid var(--border); }
  .mod-tabs .tab { flex:1; text-align:center; padding:9px 4px; border-radius:var(--radius-control); font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer; transition:all .15s; border:none; background:none; font-family:var(--font); }
  .mod-tabs .tab.on { background:var(--surface-card); color:var(--accent); box-shadow:var(--shadow-card); }

  /* archive */
  .arch-date-nav { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .arch-date-nav .cal-nav { width:30px; height:30px; border-radius:var(--radius-tile); border:1px solid var(--border-input); background:var(--surface-nested); color:var(--text); cursor:pointer; display:grid; place-items:center; transition: all .15s; }
  .arch-date-nav .cal-nav:active { background:var(--accent-muted); border-color:var(--accent); }
  .arch-date-nav .cal-nav[data-dir="prev"] svg { transform: scaleX(-1); }
  .arch-date-nav .date-text { flex:1; text-align:center; font-size:15px; font-weight:700; color:var(--text); }
  .arch-group { margin-bottom:14px; } .arch-date { font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; padding-left:2px; }
  .arch-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-tile); background:var(--surface-card); border:1px solid var(--border); margin-bottom:6px; box-shadow:var(--shadow-card); }
  .arch-item .arch-ic { width:24px; height:24px; border-radius:var(--radius-control); display:grid; place-items:center; flex:0 0 auto; background:var(--module-1); color:#fff; }
  .arch-item .arch-title { flex:1; min-width:0; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .arch-cat-badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; flex:0 0 auto; }
  .arch-cat-badge.daily { background:#dbeafe; color:var(--accent); } .arch-cat-badge.work { background:#e0e7ff; color:var(--module-2); } .arch-cat-badge.goal { background:#fef3c7; color:var(--module-3); }

  /* toast */
  .toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px); transform:translateX(-50%) translateY(16px); background:var(--text); color:var(--surface-card); font-size:13px; font-weight:600; padding:11px 16px; border-radius:999px; box-shadow:var(--shadow-overlay); z-index:70; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .alert-banner { margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-card); background: linear-gradient(135deg, #fef2f2, #fff7ed); border: 1px solid #fecaca; box-shadow: var(--shadow-card); }
  .alert-banner .ab-head { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:#ef4444; }
  .alert-banner .ab-list { margin-top: 8px; display:flex; flex-direction:column; gap:6px; }
  .alert-banner .ab-item { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); }
  .alert-banner .ab-item .ab-delay { flex:0 0 auto; font-size:11px; font-weight:700; color:#ef4444; background:#fee2e2; padding:2px 7px; border-radius:999px; }
  .alert-banner .ab-item .ab-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .data-mgmt { display: none; }

  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; height: var(--nav-h); background: rgba(255,255,255,.92); backdrop-filter: blur(14px); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4,1fr); align-items: center; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
  .nav .n { display:flex; flex-direction:column; align-items:center; gap: 4px; cursor:pointer; color: var(--text-tertiary); font-size: 10px; font-weight: 500; } .nav .n.active { color: var(--accent); font-weight: 700; }

  .drawer { position: fixed; top:0; bottom:0; left:0; width: 296px; max-width: 82vw; z-index: 50; transform: translateX(-104%); transition: transform .26s cubic-bezier(.2,.8,.25,1); overflow-y:auto; background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); color:var(--drawer-text); } .drawer.show { transform: translateX(0); }

function icon(name, size=22, sw=1.7){ const path = ICONS[name] || ICONS.grid; return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`; }

function isoToday(){ return new Date().toISOString().slice(0,10); }
function today(){ return isoToday(); }
function avgProgress(list){ if(!list||!list.length) return { value: 0, sub: "0" }; const v = Math.round(list.reduce((s,x)=>s+Math.min(100,(x.current/x.target)*100||0),0)/list.length); return { value: v, sub: `${list.length} 项` }; }
function streak(log){ if(!log) return 0; let n=0; const d=new Date(); for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; } return n; }
function formatDate(iso){ const [,m,d]=iso.split("-"); return `${parseInt(m)}月${parseInt(d)}日`; }
function delayDays(startDate){
  if(!startDate) return 0;
  const start=new Date(startDate+"T00:00:00"); const today=new Date(isoToday()+"T00:00:00");
  const diff=Math.round((today-start)/86400000);
  return diff>0?diff:0;
}
const modOf = k => CONFIG.modules.find(m=>m.key===k);
const $ = s => document.querySelector(s);

const store = {
  load(){
    const raw = localStorage.getItem(CONFIG.storageKey);

    const d = {}; CONFIG.modules.forEach(m => d[m.key] = structuredClone(m.seed||[]));
    d.archive = [
      { id: 91, title: "晨间冥想 10min", category: "daily", date: isoToday() },
      { id: 92, title: "整理工作纪要", category: "work", date: isoToday() },

    d.reviews = { daily: {}, monthly: {} };
    return d;

  save(){ localStorage.setItem(CONFIG.storageKey, JSON.stringify(data)); },

let data = store.load();
let view = "home";

/* ---- cloud sync (GitHub Gist) ---- */
const syncStore = {
  get token(){ return localStorage.getItem("gh_token")||""; },
  set token(v){ if(v) localStorage.setItem("gh_token",v); else localStorage.removeItem("gh_token"); },
  get gistId(){ return localStorage.getItem("gist_id")||""; },
  set gistId(v){ if(v) localStorage.setItem("gist_id",v); else localStorage.removeItem("gist_id"); },
  get lastSync(){ return localStorage.getItem("last_sync")||""; },
  set lastSync(v){ if(v) localStorage.setItem("last_sync",v); else localStorage.removeItem("last_sync"); },
  get connected(){ return !!this.token && !!this.gistId; },
};
let syncPushTimer = null;
let syncPulling = false;

function gistApi(method, path, body){
  return fetch(`https://api.github.com${path}`, {
    method, headers: { "Authorization": `Bearer ${syncStore.token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
}

async function syncConnect(token){
  syncStore.token = token;
  const desc = "时间管理局数据备份 (私有)";
  const listRes = await gistApi("GET", "/gists?per_page=100");
  if(listRes.ok){
    const gists = await listRes.json();
    const existing = gists.find(g=>g.description===desc && g.files && g.files["time-bureau-data.json"]);
    if(existing){
      syncStore.gistId = existing.id;
      syncStore.lastSync = new Date().toISOString();
      await syncPull();
      render();
      return existing;
    }
  }
  const res = await gistApi("POST", "/gists", {
    description: desc, public: false,
    files: { "time-bureau-data.json": { content: JSON.stringify(data, null, 2) } },
  });
  if(!res.ok){ syncStore.token=""; const err=await res.json().catch(()=>({})); throw new Error(err.message||`HTTP ${res.status}`); }
  const gist = await res.json();
  syncStore.gistId = gist.id;
  syncStore.lastSync = new Date().toISOString();
  return gist;
}

async function syncPull(){
  if(!syncStore.connected) return null;
  syncPulling = true;
  try {
    const res = await gistApi("GET", `/gists/${syncStore.gistId}`);
    if(!res.ok) return null;
    const gist = await res.json();
    const file = gist.files && gist.files["time-bureau-data.json"];
    if(!file || !file.content) return null;
    const remote = JSON.parse(file.content);
    const remoteT = remote._syncedAt || "";
    const localT = data._syncedAt || "";
    if(remoteT > localT){
      data = remote;
      delete data._syncedAt;
      store.save();
    }
    syncStore.lastSync = new Date().toISOString();
    return remote;
  } catch(e){ return null; } finally { syncPulling = false; }
}

async function syncPush(){
  if(!syncStore.connected) return;
  const snapshot = JSON.parse(JSON.stringify(data));
  snapshot._syncedAt = new Date().toISOString();
  try {
    const res = await gistApi("PATCH", `/gists/${syncStore.gistId}`, {
      files: { "time-bureau-data.json": { content: JSON.stringify(snapshot, null, 2) } },
    });
    if(res.ok) syncStore.lastSync = new Date().toISOString();
  } catch(e){}
}

function syncPushDebounced(){
  if(!syncStore.connected) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(()=>syncPush(), 3000);
}

function persist(){ store.save(); render(); syncPushDebounced(); }

function openSyncSettings(){
  const connected = syncStore.connected;
  const lastText = syncStore.lastSync ? formatTime(syncStore.lastSync) : "从未同步";
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal"><div class="grab"></div>
    <h2>${icon("cloud",18)} 云端同步</h2>
    <div class="sub">通过 GitHub Gist 在多设备间同步数据，数据存储在你的私有 Gist 中。</div>
    ${connected ? `<div class="sync-status"><div class="ss-icon" style="background:var(--accent-muted);color:var(--accent)">${icon("cloud",18)}</div><div class="ss-text"><div class="ss-title">已连接</div><div class="ss-sub">上次同步：${lastText}</div></div></div>
    <button class="btn" id="sync-now" style="width:100%;margin-bottom:10px">${icon("refresh",15)} 立即同步</button>
    <button class="btn ghost" id="sync-disconnect" style="width:100%">断开连接</button>`
    : `<a class="sync-link" href="https://github.com/settings/tokens/new?scopes=gist" target="_blank">点击生成 GitHub Token →</a>
    <div class="field"><label>粘贴 Token</label><input id="sync-token-input" type="password" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off"/></div>
    <div class="hint">Token 只需要 gist 权限，存储在本设备浏览器中，不会上传到任何服务器。</div>
    <button class="btn" id="sync-connect">连接并同步</button>`}
    <div style="margin-top:14px;padding:10px 12px;background:var(--surface-nested);border-radius:8px;font-size:11px;color:var(--text-secondary);line-height:1.5">${icon("info",13)} <b>使用方法：</b><br>1. 点击上方链接，在 GitHub 生成 Token（勾选 gist 权限）<br>2. 复制 Token 粘贴到输入框，点连接<br>3. 在另一台设备上输入同一个 Token 即可同步<br>4. 数据每次修改后自动推送，打开 App 时自动拉取</div>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) close(); };
  if(connected){
    overlay.querySelector("#sync-now").onclick = async ()=>{
      await syncPull(); syncPush(); render(); showToast("同步完成"); close();
    };
    overlay.querySelector("#sync-disconnect").onclick = ()=>{ syncStore.token=""; syncStore.gistId=""; syncStore.lastSync=""; close(); showToast("已断开连接"); };
  } else {
    overlay.querySelector("#sync-connect").onclick = async (e)=>{
      const input = overlay.querySelector("#sync-token-input");
      const token = input.value.trim();
      if(!token){ showToast("请输入 Token"); return; }
      e.target.disabled = true; e.target.textContent = "连接中…";
      try {
        await syncConnect(token);
        showToast("连接成功，数据已备份"); close();
      } catch(err){
        showToast("连接失败: "+err.message);
        e.target.disabled = false; e.target.textContent = "连接并同步";
      }
    };
  }
}

function formatTime(iso){
  const d = new Date(iso); const now = new Date();
  const diff = (now - d) / 1000;
  if(diff < 60) return "刚刚";
  if(diff < 3600) return Math.floor(diff/60)+" 分钟前";
  if(diff < 86400) return Math.floor(diff/3600)+" 小时前";
  return d.toLocaleString("zh-CN", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
}

/* ---- toast ---- */
let toastTimer=null;
function showToast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); } t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2500); }

/* ---- complete task → archive ---- */
function completeTask(taskId){
  const task=(data.tasks||[]).find(t=>t.id===taskId); if(!task) return;
  data.tasks=data.tasks.filter(t=>t.id!==taskId);
  data.archive=data.archive||[];
  data.archive.unshift({ id:Date.now(), title:task.title, category:task.category, priority:task.priority, note:task.note, date:today() });
  persist();
  showToast(`✓ 「${task.title}」已完成并归档`);
}

/* ---- toggle daily goal check ---- */
function toggleGoalCheck(goalId){
  const goal=(data.goal||[]).find(g=>g.id===goalId); if(!goal||goal.unit!=="天") return;
  goal.log=goal.log||{}; const t=today(); data.archive=data.archive||[];
  if(goal.log[t]){
    delete goal.log[t]; goal.current=Math.max(0,(+goal.current||0)-1);
    data.archive=data.archive.filter(a=>!(a.category==="goal"&&a.title===goal.title&&a.date===t));
  } else {
    goal.log[t]=true; goal.current=(+goal.current||0)+1;
    data.archive.unshift({ id:Date.now(), title:goal.title, category:"goal", date:t });
  }
  persist();
}

/* ---- export archive ---- */
function exportArchive(){
  const archive=data.archive||[]; const reviews=data.reviews||{daily:{},monthly:{}};
  let md=`# 时间管理局 · 日志导出\n\n> 导出时间：${new Date().toLocaleString("zh-CN")}\n> 数据来源：${CONFIG.owner}\n\n---\n\n`;
  if(!archive.length && !Object.keys(reviews.daily).length && !Object.keys(reviews.monthly).length){ md+="暂无日志记录。\n"; }
  else {
    const byMonth={};
    archive.forEach(a=>{ const mo=a.date.slice(0,7); if(!byMonth[mo]) byMonth[mo]=[]; byMonth[mo].push(a); });
    Object.keys(reviews.monthly).forEach(mo=>{ if(!byMonth[mo]) byMonth[mo]=[]; });
    Object.keys(byMonth).sort().reverse().forEach(mo=>{
      const [y,m]=mo.split("-"); md+=`## ${y}年${parseInt(m)}月\n\n`;
      if(reviews.monthly[mo]) md+=`### 月度复盘\n\n${reviews.monthly[mo]}\n\n`;
      const items=byMonth[mo]; const dly=items.filter(a=>a.category==="daily").length, wrk=items.filter(a=>a.category==="work").length, gl=items.filter(a=>a.category==="goal").length;
      md+=`**本月统计：** 日常 ${dly} · 工作 ${wrk} · 成长 ${gl} · 共 ${items.length} 项\n\n`;
      const byDay={}; items.forEach(a=>{ if(!byDay[a.date]) byDay[a.date]=[]; byDay[a.date].push(a); });
      Object.keys(byDay).sort().reverse().forEach(day=>{
        md+=`#### ${day}\n\n**完成事项：**\n`;
        byDay[day].forEach(a=>{ const cl=a.category==="daily"?"日常生活":a.category==="work"?"工作任务":"个人成长"; md+=`- [${cl}] ${a.title}\n`; });
        md+="\n"; if(reviews.daily[day]) md+=`**每日复盘：**\n${reviews.daily[day]}\n\n`;
      });
      md+="---\n\n";
    });
  }
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=`时间管理局日志_${today()}.md`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast("日志已导出");
}

/* ---- generate monthly summary (rule-based natural language) ---- */
function generateMonthlySummary(selMonth){
  const archive=data.archive||[]; const tasks=data.tasks||[]; const goals=data.goal||[];
  const monthItems=archive.filter(a=>a.date.startsWith(selMonth));
  const [y,mo]=selMonth.split("-").map(Number);
  if(!monthItems.length) return `【本月总结】\n${y}年${mo}月暂无完成记录，可能是一个新的开始或休息月。建议下月设定明确目标，从小事做起。`;
  const mDly=monthItems.filter(a=>a.category==="daily").length;
  const mWrk=monthItems.filter(a=>a.category==="work").length;
  const mGl=monthItems.filter(a=>a.category==="goal").length;
  const total=mDly+mWrk+mGl;
  const byDay={}; monthItems.forEach(a=>{ if(!byDay[a.date]) byDay[a.date]=[]; byDay[a.date].push(a); });
  const activeDays=Object.keys(byDay).length;
  const daysInMonth=new Date(y,mo,0).getDate();
  const avgPerDay=(total/activeDays).toFixed(1);
  const busiestDay=Object.keys(byDay).sort((a,b)=>byDay[b].length-byDay[a].length)[0];
  const busiestCount=byDay[busiestDay].length;

  // 完成率估算（基于当月任务，不含归档）
  const pendingTasks=tasks.filter(t=>!t.done).length;
  const completionRate=total>0?Math.round(total/(total+pendingTasks)*100):0;

  // 拖延任务分析
  const delayedTasks=tasks.filter(t=>!t.done&&t.startDate&&delayDays(t.startDate)>0);
  const delayedCount=delayedTasks.length;

  // 长期目标进展
  const goalProgress=goals.map(g=>{ const pct=Math.min(100,Math.round((g.current/g.target)*100||0)); return `${g.title} ${g.current}/${g.target}${g.unit||''}（${pct}%）`; });

  // 分类占比
  const dlyPct=Math.round(mDly/total*100), wrkPct=Math.round(mWrk/total*100), glPct=Math.round(mGl/total*100);

  let s=`【${y}年${mo}月 月度总结】\n\n`;
  s+=`📊 本月数据概览\n`;
  s+=`本月共完成 ${total} 项任务，活跃 ${activeDays} 天（占全月 ${daysInMonth} 天的 ${Math.round(activeDays/daysInMonth*100)}%），日均完成 ${avgPerDay} 项。\n`;
  s+=`其中：日常工作 ${mDly} 项（${dlyPct}%）、工作任务 ${mWrk} 项（${wrkPct}%）、个人成长 ${mGl} 项（${glPct}%）。\n\n`;
  s+=`🔥 亮点\n`;
  s+=`最忙的一天是 ${formatDate(busiestDay)}，完成了 ${busiestCount} 项任务。\n`;
  if(mGl>0) s+=`个人成长打卡 ${mGl} 次，坚持的力量正在累积。\n`;
  if(completionRate>=70) s+=`完成率 ${completionRate}%，执行力不错，继续保持节奏！\n`;
  else if(completionRate>=40) s+=`完成率 ${completionRate}%，有进展但仍有提升空间。\n`;
  else s+=`完成率 ${completionRate}%，可能需要调整目标或优先级。\n\n`;
  s+=`\n⚠️ 需要关注\n`;
  if(delayedCount>0){ s+=`当前有 ${delayedCount} 项任务处于拖延状态：\n`; delayedTasks.slice(0,5).forEach(t=>s+=`  · ${t.title}（已拖延 ${delayDays(t.startDate)} 天）\n`); }
  else s+=`暂无拖延任务，时间管理状态良好。\n`;
  s+=`\n🎯 长期目标进展\n`;
  if(goalProgress.length) goalProgress.forEach(g=>s+=`  · ${g}\n`);
  else s+=`  暂未设置长期目标，建议规划一下。\n`;
  s+=`\n💡 下月建议\n`;
  if(mWrk<mDly) s+=`工作任务完成数偏少，可考虑增加工作投入或拆分大任务。\n`;
  if(mGl===0) s+=`本月未进行个人成长打卡，建议从一个小习惯开始。\n`;
  if(delayedCount>2) s+=`拖延任务较多，建议优先清理积压，必要时重新评估优先级。\n`;
  if(activeDays<daysInMonth*0.5) s+=`活跃天数偏少，可以尝试提高记录频率，让进步可见。\n`;
  s+=`\n（本总结由时间管理局根据归档数据自动生成）`;
  return s;
}

function trendSVG(series){
  const w=320,h=120,padX=10,padTop=14,padBot=18; const max=Math.max(...series),min=Math.min(...series); const rng=(max-min)||1; const innerW=w-2*padX,innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{ const x=padX+innerW*i/(series.length-1); const y=padTop+innerH*(1-(v-min)/rng); return [x,y]; });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

function weekLabels(){ const wds=["日","一","二","三","四","五","六"]; const today=new Date().getDay(); const labels=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); labels.push(wds[d.getDay()]); } return labels.join('</span><span>'); }

function renderTasksModule(key){
  const m=modOf(key); const tab=m._tab||"growth"; const tasks=data.tasks||[];
  const tabs=`<div class="mod-tabs"><div class="tab ${tab==='growth'?'on':''}" data-tab="growth">个人成长</div><div class="tab ${tab==='work'?'on':''}" data-tab="work">工作任务</div><div class="tab ${tab==='daily'?'on':''}" data-tab="daily">日常生活</div></div>`;
  let head="",body=""; let showAdd=true;

  if(tab==="growth"){
    const goals=(data.goal||[]).filter(g=>g.unit==="天"); const t=today(); showAdd=false;
    const done=goals.filter(g=>g.log&&g.log[t]).length;
    head=headHero(m,`${done}/${goals.length}`,"今日已打卡",goals.length?Math.round(done/goals.length*100):0);
    body=goals.length?`<div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;padding:0 2px">以下目标来自「长期目标」，打勾后自动同步进度</div>`+goals.map(g=>{
      const on=!!(g.log&&g.log[t]); const st=streak(g.log); const pct=Math.min(100,Math.round((g.current/g.target)*100||0));
      return `<div class="rec"><div class="top"><div class="chk js-goal-chk ${on?'on':''}" data-id="${g.id}">${icon("check",14,2.4)}</div><div class="body" data-edit-goal="${g.id}"><div class="rname">${esc(g.title)}</div><div class="rmeta"><span class="streak">${icon("flame",13)} 连续 ${st} 天</span><span style="color:var(--text-secondary);font-size:13px">${g.current}/${g.target} 天 · ${pct}%</span></div><div class="pbar"><i style="width:${pct}%;background:var(--module-3)"></i></div>${g.note?`<div class="rnote">${esc(g.note)}</div>`:''}</div></div></div>`;
    }).join(""):`<div class="empty"><span class="e">${icon("target",26)}</span><div>在「长期目标」中添加单位为「天」的目标<br>会自动同步到这里作为每日打卡</div></div><div style="text-align:center;margin-top:12px"><button class="btn ghost" data-go="goal" style="display:inline-block">去添加目标</button></div>`;
  } else {
    const filtered=tasks.filter(x=>x.category===tab);
    head=headHero(m,`${filtered.length}`,`${tab==='daily'?'日常':'工作'}待办`,null);
    body=filtered.length?filtered.map(x=>recHTML(m,x)).join(""):`<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>还没有${tab==='daily'?'日常':'工作'}任务，点上方「新建」添加</div></div>`;
  }

  const addBtn=showAdd?`<button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button>`:'';
  $("#screen").innerHTML=`<div class="greet"><div><span class="bureau-badge">🐶 ${CONFIG.owner}</span><h1>${m.name}</h1><p>${m.desc}</p></div>${addBtn}</div><div style="margin-top:16px">${head}${tabs}<div class="sec-title">记录</div>${body}</div>`;
  wireTasksModule(key,tab);
}

function wireTasksModule(key,tab){
  const m=modOf(key);
  $("#screen").querySelectorAll(".mod-tabs .tab").forEach(el=>el.onclick=()=>{ m._tab=el.dataset.tab; render(); });
  $("#screen").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
  if(tab==="growth"){
    $("#screen").querySelectorAll(".js-goal-chk").forEach(el=>el.onclick=e=>{ e.stopPropagation(); toggleGoalCheck(+el.dataset.id); });
    $("#screen").querySelectorAll("[data-edit-goal]").forEach(el=>el.onclick=()=>openEditor("goal",(data.goal||[]).find(g=>g.id==el.dataset.editGoal)));
  } else {
    $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{ e.stopPropagation(); completeTask(+el.dataset.id); });
    $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data.tasks||[]).find(i=>i.id==el.dataset.edit),tab));
    $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key,el.dataset.id); });
    $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data.tasks||[]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
    const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null,tab);
  }
}

/* ---- ARCHIVE MODULE ---- */
function renderArchiveModule(key){
  const m=modOf(key); const tab=m._tab||"daily"; const archive=data.archive||[]; const reviews=data.reviews||{daily:{},monthly:{}};
  const tabs=`<div class="mod-tabs"><div class="tab ${tab==='daily'?'on':''}" data-tab="daily">每日复盘</div><div class="tab ${tab==='monthly'?'on':''}" data-tab="monthly">每月复盘</div></div>`;
  let content="";

  if(tab==="daily"){
    const selDate=m._date||today(); const dayItems=archive.filter(a=>a.date===selDate);
    const dateNav=`<div class="arch-date-nav"><button class="cal-nav" data-dir="prev">${icon("chevron",16,2)}</button><span class="date-text">${formatDate(selDate)}${selDate===today()?' · 今天':''}</span><button class="cal-nav" data-dir="next">${icon("chevron",16,2)}</button></div>`;
    const itemsList=dayItems.length?dayItems.map(a=>{ const cl=a.category||"daily"; const lb=cl==="daily"?"日常":cl==="work"?"工作":"成长";
      return `<div class="arch-item"><span class="arch-ic">${icon("check",14,2.4)}</span><span class="arch-title">${esc(a.title)}</span><span class="arch-cat-badge ${cl}">${lb}</span></div>`; }).join("")
      : `<div class="empty"><span class="e">${icon("pen",26)}</span><div>当天暂无完成记录</div></div>`;
    const reviewText=reviews.daily[selDate]||"";
    content=`${dateNav}<div class="sec-title">完成事项 (${dayItems.length})</div><div class="arch-list">${itemsList}</div><div class="sec-title">每日复盘</div><div class="field"><textarea id="f-review" placeholder="今天做得怎么样？有什么收获和反思？" style="min-height:120px">${esc(reviewText)}</textarea></div><button class="btn" id="btn-save-review">保存复盘</button>`;
  } else {
    const selMonth=m._month||today().slice(0,7); const monthItems=archive.filter(a=>a.date.startsWith(selMonth));
    const [y,mo]=selMonth.split("-"); const monthNav=`<div class="arch-date-nav"><button class="cal-nav" data-dir="prev">${icon("chevron",16,2)}</button><span class="date-text">${y}年${parseInt(mo)}月</span><button class="cal-nav" data-dir="next">${icon("chevron",16,2)}</button></div>`;
    const mDly=monthItems.filter(a=>a.category==="daily").length, mWrk=monthItems.filter(a=>a.category==="work").length, mGl=monthItems.filter(a=>a.category==="goal").length;
    const byDay={}; monthItems.forEach(a=>{ if(!byDay[a.date]) byDay[a.date]=[]; byDay[a.date].push(a); });
    const dayList=Object.keys(byDay).sort().reverse().map(day=>{ const items=byDay[day].map(a=>{ const cl=a.category||"daily"; const lb=cl==="daily"?"日常":cl==="work"?"工作":"成长";
      return `<div class="arch-item"><span class="arch-ic">${icon("check",14,2.4)}</span><span class="arch-title">${esc(a.title)}</span><span class="arch-cat-badge ${cl}">${lb}</span></div>`; }).join("");
      return `<div class="arch-group"><div class="arch-date">${formatDate(day)}</div>${items}</div>`; }).join("");
    const reviewText=reviews.monthly[selMonth]||"";
    content=`${monthNav}<div class="mod-summary"><div class="mini"><div class="l">日常</div><div class="v" style="color:var(--accent)">${mDly}</div></div><div class="mini"><div class="l">工作</div><div class="v" style="color:var(--module-2)">${mWrk}</div></div><div class="mini"><div class="l">成长</div><div class="v" style="color:var(--module-3)">${mGl}</div></div></div><div class="sec-title">完成记录 (${monthItems.length})</div><div class="arch-list">${dayList||`<div class="empty"><span class="e">${icon("pen",26)}</span><div>本月暂无完成记录</div></div>`}</div><div class="sec-title">每月复盘</div><div class="field"><textarea id="f-review" placeholder="这个月整体表现如何？有什么总结和计划？" style="min-height:120px">${esc(reviewText)}</textarea></div><div style="display:flex;gap:10px;margin-bottom:12px"><button class="btn" id="btn-save-review" style="flex:1">保存复盘</button><button class="btn ghost" id="btn-gen-summary" style="flex:0 0 auto;padding:13px 16px">生成总结</button></div>`;
  }

  $("#screen").innerHTML=`<div class="greet"><div><span class="bureau-badge">🐶 ${CONFIG.owner}</span><h1>${m.name}</h1><p>${m.desc}</p></div><button class="add" id="btn-export-top">${icon("download",16,2.2)}导出</button></div><div style="margin-top:16px">${tabs}${content}<button class="btn ghost" id="btn-export" style="margin-top:12px;width:100%">导出日志 (Markdown)</button></div>`;
  wireArchiveModule(key,tab);
}

function wireArchiveModule(key,tab){
  const m=modOf(key);
  $("#screen").querySelectorAll(".mod-tabs .tab").forEach(el=>el.onclick=()=>{ m._tab=el.dataset.tab; render(); });
  if(tab==="daily"){
    const selDate=m._date||today();
    $("#screen").querySelectorAll("[data-dir]").forEach(el=>el.onclick=()=>{ const d=new Date(selDate); if(el.dataset.dir==="prev") d.setDate(d.getDate()-1); else d.setDate(d.getDate()+1); m._date=d.toISOString().slice(0,10); render(); });
  } else {
    const selMonth=m._month||today().slice(0,7);
    $("#screen").querySelectorAll("[data-dir]").forEach(el=>el.onclick=()=>{ let [y,mo]=selMonth.split("-").map(Number); if(el.dataset.dir==="prev"){ mo--; if(mo<1){mo=12;y--;} } else { mo++; if(mo>12){mo=1;y++;} } m._month=`${y}-${String(mo).padStart(2,"0")}`; render(); });
  }
  const saveBtn=$("#btn-save-review"); if(saveBtn) saveBtn.onclick=()=>{ const text=$("#f-review").value.trim(); if(!data.reviews) data.reviews={daily:{},monthly:{}}; if(tab==="daily"){ const sd=m._date||today(); data.reviews.daily[sd]=text; } else { const sm=m._month||today().slice(0,7); data.reviews.monthly[sm]=text; } store.save(); showToast("复盘已保存"); };
  const genBtn=$("#btn-gen-summary"); if(genBtn) genBtn.onclick=()=>{ const summary=generateMonthlySummary(m._month||today().slice(0,7)); const ta=$("#f-review"); if(ta){ const existing=ta.value.trim(); ta.value=existing?existing+"\n\n"+summary:summary; } store.save(); if(!data.reviews) data.reviews={daily:{},monthly:{}}; data.reviews.monthly[m._month||today().slice(0,7)]=$("#f-review").value.trim(); showToast("总结已生成并填入"); };
  const eh=()=>exportArchive(); const e1=$("#btn-export"), e2=$("#btn-export-top"); if(e1) e1.onclick=eh; if(e2) e2.onclick=eh;
}

/* ---- recHTML ---- */
function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",16)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`; const chkMark=icon("check",14,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default'; const layoutCls=`rec-layout-${layout}`;

  if(layout==='feature'&&x.image){ const body=(x.content||x.note||'').trim(); return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column">${thumb}<div class="feat-title">${esc(x.title||'无标题')}</div>${body?`<div class="feat-body">${esc(body)}</div>`:''}${customBlock?`<div style="padding:0 12px 12px">${customBlock}</div>`:''}</div></div>`; }
  if(layout==='quote'){ const text=(x.content||x.title||'').trim(); return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center"><div class="quote-text">${esc(text)}</div>${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`; }

  if(m.type==="tasks"||m.type==="todo"){
    const p=(m.priorities||[]).find(p=>p.key===x.priority);
    const delay=(!x.done&&x.startDate)?delayDays(x.startDate):0;
    const delayBadge=delay>0?`<span class="badge" style="background:#fef2f2;color:#ef4444"><span class="dot"></span>已拖延 ${delay} 天</span>`:'';
    return `<div class="rec ${layoutCls}">${acts}<div class="top"><div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>${thumb}<div class="body" data-edit="${x.id}"><div class="rname ${x.done?'done':''}">${esc(x.title)}</div><div class="rmeta">${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}${delayBadge}</div>${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="progress"){
    const pct=Math.min(100,Math.round((x.current/x.target)*100||0)); const isDaily=x.unit==="天";
    const syncBadge=isDaily?`<span class="badge" style="background:#fef3c7;color:#f59e0b"><span class="dot"></span>同步个人成长</span>`:'';
    const streakBadge=isDaily?`<span class="streak">${icon("flame",13)} 连续 ${streak(x.log)} 天</span>`:'';
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title)}</div><div class="rmeta">${streakBadge}<span style="color:var(--text-secondary);font-size:13px">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span>${syncBadge}</div><div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title||'无标题')}</div><div class="rmeta">${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}<span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${customBlock}</div></div></div>`;
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key,el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
}

/* ---- EDITOR ---- */
function openEditor(key,item,defaultTab){
  const m=modOf(key); const editing=!!item; const d=item||newItem(m,defaultTab);
  let fields="";
  if(m.type==="tasks"){
    const cat=(item&&item.category)||defaultTab||"growth";
    fields=`<div class="field"><label>分类</label><div class="seg" id="f-cat"><div class="opt ${cat==='work'?'on':''}" data-v="work">工作任务</div><div class="opt ${cat==='daily'?'on':''}" data-v="daily">日常生活</div></div></div>
      <div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>开始时间</label><input id="f-start" type="date" value="${attr(d.startDate||isoToday())}"/><p class="hint">💡 从开始日期次日起，未完成的任务会自动计算拖延天数</p></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div><div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div><div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <p class="hint">💡 单位为「天」的目标会自动同步到「任务队列 · 个人成长」作为每日打卡</p>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else {
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>`;
  }
  (m.fields||[]).forEach(f=>{ const v=d[f.key]||""; if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" style="flex-wrap:wrap" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`; else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`; else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`; else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`; });

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>${fields}<div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}<button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove(); overlay.onclick=e=>{ if(e.target===overlay) close(); }; overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key,d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    if(m.type==="tasks"){ d.category=seg("#f-cat")||defaultTab||"daily"; d.priority=seg("#f-prio")||d.priority; d.startDate=val("#f-start")||isoToday(); d.note=(val("#f-note")||"").trim(); d.done=false; if(!editing) (data.tasks=data.tasks||[]).unshift(d); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); if(!editing) (data.goal=data.goal||[]).unshift(d); }
    else { d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); if(!editing) (data[key]=data[key]||[]).unshift(d); }
    (m.fields||[]).forEach(f=>{ if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||""; else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0); else d[f.key]=(val("#f-cf-"+f.key)||"").trim(); });
    persist(); close();
  };
}

function newItem(m,defaultTab){
  const base={ id:Date.now() }; let item;
  if(m.type==="tasks") item={...base,title:"",category:defaultTab||"growth",priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"),startDate:isoToday(),done:false,note:""};
  else if(m.type==="progress") item={...base,title:"",current:0,target:20,unit:m.unit||"",note:"",log:{}};
  else item={...base,title:"",content:"",mood:(m.moods&&m.moods[0])||""};
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]=f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2><div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div><div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove(); overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close; overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* ---- router / nav ---- */
function go(v){ view=v; render(); window.scrollTo({top:0}); }
function render(){
  if(view==="home"){ $("#topTitle").firstChild.textContent=CONFIG.owner; $("#topSub").textContent=CONFIG.slogan; }
  else { const m=modOf(view); $("#topTitle").firstChild.textContent=m?m.name:CONFIG.owner; $("#topSub").textContent=m?m.desc:""; }
  $("#nav").querySelectorAll(".n").forEach(n=>n.classList.toggle("active",n.dataset.nav===view));
  const sb = $("#btn-sync-settings"); if(sb){ sb.classList.toggle("connected", syncStore.connected); const badge = sb.querySelector(".sync-badge"); if(badge) badge.classList.toggle("off", !syncStore.connected); }
  if(view==="home") renderHome(); else renderModule(view);
}

$("#nav").querySelectorAll(".n").forEach(n=>n.onclick=()=>go(n.dataset.nav));

const syncBtn = $("#btn-sync-settings");
if(syncBtn){
  syncBtn.innerHTML = icon("cloud",18) + (syncStore.connected ? '<span class="sync-badge"></span>' : '<span class="sync-badge off"></span>');
  syncBtn.classList.toggle("connected", syncStore.connected);
  syncBtn.onclick = ()=>openSyncSettings();
}

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

render();

if(syncStore.connected){ syncPull().then(()=>render()); }
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
